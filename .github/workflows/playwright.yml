name: Playwright with Docker Compose (Multi-service)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run services with Docker Compose
        run: docker compose up --build -d

      - name: Wait for services to be ready
        run: |
          timeout 60s sh -c 'until docker compose ps --filter "status=healthy" | grep -q app; do echo "Waiting for app service..."; sleep 2; done'
        
      - name: Run tests and generate reports in container
        run: docker compose exec -T e2e-tests npm run test
      
      - name: Upload Cucumber report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: reports/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down -v
