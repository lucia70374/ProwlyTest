services:
  e2e-tests:
    build: .
    container_name: playwright-cucumber-tests
    command: ["npm", "run", "test:cucumber"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_HOST=http://app:3000
      - IN_DOCKER=true  # Custom flag for hooks.ts
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ipc: host
    deploy:
      resources:
        limits:
          memory: 4096M # Allocate 4 GB of memory

  app:
    # Build a separate image for the app service to include `curl`
    build: ./app
    container_name: application-under-test
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
