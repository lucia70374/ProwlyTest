services:
  e2e-tests:
    build: .
    container_name: playwright-cucumber-tests
    # Use bash to execute the script, which avoids permission issues
    entrypoint: ["/usr/bin/env", "bash", "./entrypoint.sh"]
    command: ["npm", "run", "test:cucumber"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_HOST=http://app:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ipc: host

  app:
    image: node:18
    container_name: application-under-test
    ports:
      - "3000:3000"
    # UPDATED: Use a command that runs indefinitely, and listen on 0.0.0.0.
    command: node -e "require('http').createServer((req, res) => res.end('Hello!')).listen(3000, '0.0.0.0')"
    healthcheck:
      # Use curl, which is typically installed, or manually install wget.
      # The command must exit with 0 for success.
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Give the app a grace period to start
