version: '3.8'

services:
  e2e-tests:
    build: .
    container_name: playwright-cucumber-tests
    # Use the custom entrypoint script to fix permissions and wait
    entrypoint: ["./entrypoint.sh"]
    command: ["npm", "run", "test:cucumber"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_HOST=http://app:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ipc: host

  app:
    image: node:18
    container_name: application-under-test
    ports:
      - "3000:3000"
    # UPDATED: Use a command that runs indefinitely, such as 'node app.js'.
    # For a simple example, a tail command will keep it alive.
    command: tail -f /dev/null
    # OR, use a command that keeps the app running:
    # command: node -e "require('http').createServer((req, res) => res.end('Hello!')).listen(3000)"
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:3000 -O /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
