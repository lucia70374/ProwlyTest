services:
  e2e-tests:
    build: .
    container_name: playwright-cucumber-tests
    # Use the custom entrypoint script
    entrypoint: ["./entrypoint.sh"]
    depends_on:
      app:
        # A standard `service_started` dependency is sufficient when using a wait script.
        condition: service_started
    environment:
      - APP_HOST=http://app:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ipc: host

  app:
    # ... (your app service remains the same)
    # The healthcheck is still useful for debugging but can be removed if not needed.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
